name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MISE_EXPERIMENTAL: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/jdx/mise-action@v2
      - run: mise run install
      - run: mise run lint
      - run: mise run fmt:check
      - run: mise run typecheck

  build-ts:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/jdx/mise-action@v2
      - run: mise run install
      - run: mise run build
      - run: mise run test

  build-native:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/jdx/mise-action@v2
      - run: mise run cargo:check
      - run: mise run test:native

  ci:
    needs: [lint, build-ts, build-native]
    runs-on: docker
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" \
             || "${{ needs.build-ts.result }}" != "success" \
             || "${{ needs.build-native.result }}" != "success" ]]; then
            echo "::error::one or more required jobs failed"
            exit 1
          fi
