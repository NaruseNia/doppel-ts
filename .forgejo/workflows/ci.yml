name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: docker
    container: node:22
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable && corepack prepare pnpm@latest --activate

      - run: pnpm install --frozen-lockfile

      - name: oxlint
        run: pnpm -w run lint

      - name: oxfmt
        run: pnpm -w run fmt:check

      - name: Build core (for cli type resolution)
        run: pnpm --filter @doppel-ts/core build

      - name: typecheck
        run: pnpm --filter @doppel-ts/core --filter doppel-ts exec tsc --noEmit

  build-ts:
    runs-on: docker
    strategy:
      matrix:
        node-version: ["20", "22"]
    container: node:${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable && corepack prepare pnpm@latest --activate

      - run: pnpm install --frozen-lockfile

      - name: Build core & cli
        run: pnpm --filter @doppel-ts/core --filter doppel-ts build

      - name: Test
        run: pnpm --filter @doppel-ts/core --filter doppel-ts test

  build-native:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: packages/native
        run: cargo check

      - name: Cargo test
        working-directory: packages/native
        run: cargo test
