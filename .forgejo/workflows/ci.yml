name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: oxlint
        run: pnpm -w run lint

      - name: oxfmt
        run: pnpm -w run fmt:check

      - name: typecheck
        run: pnpm -r exec tsc --noEmit

  build-ts:
    runs-on: codeberg-small
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build core & cli
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

  build-native:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: packages/native
        run: cargo check

      - name: Cargo test
        working-directory: packages/native
        run: cargo test
