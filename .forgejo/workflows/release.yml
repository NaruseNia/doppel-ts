name: Release

# Release is handled by GitHub Actions (.github/workflows/release.yml)
# which has access to macOS/Windows/Linux runners for cross-platform native builds.
# This file is kept as a no-op to avoid Forgejo errors on tag push.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  noop:
    runs-on: docker
    steps:
      - run: echo "Release is handled by GitHub Actions"
